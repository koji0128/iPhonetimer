<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f6f7f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タイマー">
<link rel="manifest" href="manifest.json">
<title>タイマー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f6f7f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
.app{width:min(100%,520px);margin:0 auto;min-height:calc(100vh - max(18px,env(safe-area-inset-top)) - max(24px,env(safe-area-inset-bottom)));display:flex;flex-direction:column}
header{text-align:center;padding:8px 0 14px}
.title{font-size:20px;font-weight:700}
.sub{font-size:13px;color:#71808d;margin-top:4px}
.card{background:#fff;border:1px solid #e5e8eb;border-radius:28px;padding:28px 20px 24px;box-shadow:0 8px 28px rgba(0,0,0,.05)}
.label{text-align:center;color:#71808d;font-size:14px;margin-bottom:8px}
.time{font-variant-numeric:tabular-nums;text-align:center;font-size:clamp(72px,22vw,112px);line-height:1;font-weight:750;letter-spacing:.02em}
.unit{text-align:center;color:#71808d;font-size:14px;margin-top:8px}
.setting{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:26px}
.setting button{width:52px;height:52px;border:0;border-radius:16px;background:#eef1f3;font-size:28px;color:#17202a}
.seconds{min-width:118px;text-align:center;font-size:22px;font-weight:700}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.presets button{min-height:44px;border:1px solid #dfe3e6;background:#fff;border-radius:14px;font-weight:650;color:#33404b}
.controls{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin-top:18px}
.controls button{min-height:58px;border-radius:18px;font-size:18px;font-weight:750}
.start{border:0;background:#167f78;color:#fff}
.stop{border:1px solid #d5dadd;background:#fff;color:#26323b}
.message{text-align:center;min-height:22px;margin:14px 0 0;color:#687681;font-size:13px}
.help{text-align:center;color:#84909a;font-size:12px;margin-top:auto;padding-top:18px}
@media(max-width:360px){.presets{grid-template-columns:repeat(2,1fr)}.time{font-size:72px}}
</style>
</head>
<body>
<main class="app">
<header><div class="title">カウントダウンタイマー</div><div class="sub">0秒になるとアラームが鳴ります</div></header>
<section class="card" aria-label="タイマー">
<div class="label">残り時間</div>
<div id="display" class="time" aria-live="polite">00:30</div>
<div class="unit">設定時間</div>

<div class="setting">
<button id="minus" type="button" aria-label="10秒減らす">−</button>
<div id="seconds" class="seconds">30秒</div>
<button id="plus" type="button" aria-label="10秒増やす">＋</button>
</div>

<div class="presets">
<button type="button" data-sec="10">10秒</button>
<button type="button" data-sec="30">30秒</button>
<button type="button" data-sec="60">1分</button>
<button type="button" data-sec="180">3分</button>
</div>

<div class="controls">
<button id="start" class="start" type="button">▶ スタート</button>
<button id="stop" class="stop" type="button">↻ リセット</button>
</div>
<div id="message" class="message" aria-live="polite"></div>
</section>
<div class="help">リセットすると設定した秒数に戻ります</div>
</main>

<script>
(() => {
const display=document.getElementById('display');
const secondsEl=document.getElementById('seconds');
const message=document.getElementById('message');
const start=document.getElementById('start');
const stop=document.getElementById('stop');
const minus=document.getElementById('minus');
const plus=document.getElementById('plus');
let setting=30, remaining=30, timer=null, end=0, audio=null;

function fmt(s){
 s=Math.max(0,Math.ceil(s));
 const m=Math.floor(s/60), sec=s%60;
 return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function render(){
 display.textContent=fmt(remaining);
 secondsEl.textContent=setting>=60 ? (setting%60===0 ? setting/60+'分' : setting+'秒') : setting+'秒';
}
function reset(){
 if(timer){clearInterval(timer);timer=null}
 remaining=setting; render();
}
function beep(){
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  audio=audio||new C();
  if(audio.state==='suspended')audio.resume();
  const now=audio.currentTime;
  [0,.32,.64].forEach((d)=>{
   const o=audio.createOscillator(),g=audio.createGain();
   o.type='sine';o.frequency.value=880;
   g.gain.setValueAtTime(.001,now+d);
   g.gain.exponentialRampToValueAtTime(.35,now+d+.02);
   g.gain.exponentialRampToValueAtTime(.001,now+d+.24);
   o.connect(g).connect(audio.destination);o.start(now+d);o.stop(now+d+.26);
  });
 }catch(e){}
}
function setTime(s){
 setting=Math.max(1,Math.min(86400,Math.round(s)));
 reset(); message.textContent=setting+'秒に設定しました';
}
function run(){
 if(timer)return;
 if(remaining<=0)remaining=setting;
 if(audio&&audio.state==='suspended')audio.resume();
 end=Date.now()+remaining*1000;
 message.textContent='カウント中…';
 timer=setInterval(()=>{
  remaining=Math.max(0,(end-Date.now())/1000); render();
  if(remaining<=0){
   clearInterval(timer);timer=null;remaining=0;render();
   message.textContent='時間になりました！';
   beep();
  }
 },50);
}
minus.addEventListener('click',()=>setTime(setting-10));
plus.addEventListener('click',()=>setTime(setting+10));
document.querySelectorAll('[data-sec]').forEach(b=>b.addEventListener('click',()=>setTime(Number(b.dataset.sec))));
start.addEventListener('click',run);
stop.addEventListener('click',()=>{reset();message.textContent=setting+'秒に戻しました'});
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
